# typos checks English spelling in source code and documentation.

[files]
# Files and paths excluded from spell checking.
extend-exclude = ["CHANGELOG.md", "uv.lock", "examples/fixtures/"]
ignore-hidden = true # Ignore hidden files.
ignore-vcs = true    # Ignore files excluded by VCS ignore rules.
ignore-dot = true    # Ignore files excluded by .ignore files.

# Spell-checking behavior.
[default]
check-filename = true # Check file names.
check-file = true     # Check file contents.
locale = "en"
binary = false        # Whether to check binary files.
unicode = true        # Support Unicode identifiers.
# Regular expressions for ignored content, including inline disable comments.
extend-ignore-re = [
    "(?Rm)^.*#\\s*spellchecker:disable-line$",
    "(?s)#\\s*spellchecker:off.*?\\n\\s*#\\s*spellchecker:on",
]
extend-ignore-identifiers-re = []
extend-ignore-words-re = []

[default.extend-words]
# Python ecosystem.
asyncio = "asyncio"
httpx = "httpx"
hatchling = "hatchling"
mypy = "mypy"
pydantic = "pydantic"
pytest = "pytest"
respx = "respx"
ruff = "ruff"
uv = "uv"

# Anti-bot vendor field names that appear verbatim on the wire and must not be
# "corrected". Renaming any of these would silently break the request.
abck = "abck"
bmsz = "bmsz"
ddk = "ddk"
lso = "lso"
pxde = "pxde"
pxvid = "pxvid"
reese = "reese"
sbsd = "sbsd"
