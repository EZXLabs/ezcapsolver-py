[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezcapsolver-py"
version = "0.1.0"
description = "Python SDK for EzCaptchaSolver."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "EZXLabs", email = "admin@ezxlabs.com" }]
keywords = [
    "captcha",
    "recaptcha",
    "funcaptcha",
    "hcaptcha",
    "turnstile",
    "cloudflare",
    "akamai",
    "datadome",
    "perimeterx",
    "incapsula",
    "anti-bot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://ezxlabs.com"
Repository = "https://github.com/EZXLabs/ezcapsolver-py"
Issues = "https://github.com/EZXLabs/ezcapsolver-py/issues"
Changelog = "https://github.com/EZXLabs/ezcapsolver-py/releases"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["ezcapsolver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific
    "D",     # pydocstyle
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
]
ignore = [
    "D203",
    "D213",
    "ANN401",
    "RUF003",
    "RUF009",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D", "ANN", "T201"]
"ezcapsolver/async_client.py" = ["ASYNC109"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["ezcapsolver"]
branch = true
